<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dashboard</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}input{display:block;margin:4px 0 2px;padding:6px;width:100%;box-sizing:border-box}.error{color:#b00020;font-size:.9em;min-height:1em}.flash{background:#e6f4ea;padding:8px 12px;border-radius:6px;min-height:1em}button{margin-top:12px;padding:8px 16px}code{background:#f3f3f3;padding:2px 4px}</style></head>
<body>
  <h1>Dashboard</h1>
  <p>Signed in. Session id now: <code id="sid">@{ sid }</code></p>
  <form method="POST" action="/logout">{@ csrf @}<button type="submit" id="logout">Sign out</button></form>
</body></html>
